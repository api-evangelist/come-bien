aid: come-bien
name: Come Bien
description: >-
  Come Bien is a Mexican foodtech company operating a digital corporate cafeteria
  (comedor digital) that delivers fresh, home-style, nutritionally balanced meals to
  offices without requiring any on-site kitchen installation. Employees choose from a
  rotating seven-week cyclical menu each day, place their order through the Come Bien
  app, and receive individually bagged, ready-to-eat meals delivered to the workplace
  in 100% biodegradable packaging. A dedicated backoffice platform lets employers
  subsidize, administer, and gain full visibility into their team's food benefit.
  Backed by 500 Global, the company reports serving 100+ companies, 10,000+ employees,
  and more than 1.5M orders delivered.
